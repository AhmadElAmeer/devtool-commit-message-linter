[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmlint"
version = "0.1.0"
description = "Commit message linter and git hook for the Conventional Commits format"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmad Kaiss"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cmlint = "cmlint.cli:main"

[tool.setuptools]
packages = ["cmlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# This repository lints its own commits.
[tool.cmlint]
header-max-length = 72
imperative-mood = "error"
